<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The analytics script is not here. It loads only after the player selects OK on the analytics notice. See "src/shared/analytics.ts". -->
    <meta
      name="description"
      content="Skardela: free daily puzzles of new types. No account, no download."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#e05a2b" />
    <link rel="canonical" href="https://skardela.netlify.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Skardela</title>

    <!-- Open Graph tags. Facebook, LinkedIn, WhatsApp, Slack, Discord and others use these for link previews. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Skardela" />
    <meta property="og:url" content="https://skardela.netlify.app/" />
    <meta property="og:title" content="Skardela" />
    <meta
      property="og:description"
      content="Free daily puzzles of new types. No account, no download."
    />
    <meta property="og:image" content="https://skardela.netlify.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Skardela logo and name" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X card tags. X uses the Open Graph tags when a tag is not here. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Skardela" />
    <meta
      name="twitter:description"
      content="Free daily puzzles of new types. No account, no download."
    />
    <meta name="twitter:image" content="https://skardela.netlify.app/og-image.png" />
    <meta name="twitter:image:alt" content="The Skardela logo and name" />
    <!-- This sets the saved theme before the page shows, so the page does not flash. It must use the same key and field name as "src/shared/state/saved-data.ts". -->
    <script>
      try {
        var settings = JSON.parse(localStorage.getItem("skardela.netlify.app"));
        var theme = settings && settings.theme;
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <noscript>Skardela needs JavaScript. Turn on JavaScript to play.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
